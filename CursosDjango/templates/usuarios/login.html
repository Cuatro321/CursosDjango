{% extends 'contenido/base.html' %}
{% load static %}
{% block title %}Iniciar Sesión – CursosDjango{% endblock %}

{% block content %}

 
<div class="container py-5 d-flex justify-content-center">
  <div style="max-width: 400px; width: 100%; background: #121217cc; border: 2px solid #39ff14; border-radius: 12px; padding: 30px;">
    <div class="text-center mb-4">
      <img src="{% static 'images/logo1.png' %}" alt="Ilustración Iniciar Sesión" style="max-width: 180px; width: 100%; border-radius: 8px;">
    </div>
    <h2 class="text-center neon-text mb-3" style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 2.2rem; letter-spacing: 2px;">
      Iniciar Sesión
    </h2>

 
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success w-100 mt-4 fw-bold" style="font-size: 1.1rem; letter-spacing: 1.5px;">
        Entrar
      </button>
    </form>

    <p class="mt-4 text-center" style="color: #c139fcff;">
      ¿No tienes cuenta? <a href="{% url 'register' %}" style="color: #39ff14; text-decoration: none; font-weight: 600;">Regístrate</a>
    </p>
    <div class="text-center mt-2">
      <img src="{% static 'images/logo.png' %}" alt="Icono Login" style="width: 40px; opacity: 0.7;">
    </div>
  </div>
</div>
{% endblock %}
