{% extends 'contenido/base.html' %}
{% load static %}
{% block title %}Registrar Cuenta – CursosDjango{% endblock %}

{% block content %}
    
<div class="container py-5 d-flex justify-content-center">
  <div style="max-width: 420px; width: 100%; background: #121217cc; border: 2px solid #39ff14; border-radius: 12px; padding: 30px;">
    <div class="text-center mb-4">
      <img src="{% static 'images/logo1.png' %}" alt="Ilustración Registro" style="max-width: 180px; width: 100%; border-radius: 8px;">
    </div>
    <h2 class="text-center neon-text mb-3" style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 2.2rem; letter-spacing: 2px;">
      Registro
    </h2>


    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success w-100 mt-4 fw-bold" style="font-size: 1.1rem; letter-spacing: 1.5px;">
        Crear cuenta
      </button>
    </form>

    <p class="mt-4 text-center" style="color: #9a39fcff;">
      ¿Ya tienes cuenta? <a href="{% url 'login' %}" style="color: #39ff14; text-decoration: none; font-weight: 600;">Inicia Sesión</a>
    </p>
    <div class="text-center mt-2">
      <img src="{% static 'images/logo.png' %}" alt="Icono Registro" style="width: 40px; opacity: 0.7;">
    </div>
  </div>
</div>
{% endblock %}
