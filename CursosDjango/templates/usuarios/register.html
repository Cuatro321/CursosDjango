{% extends 'contenido/base.html' %}
{% block title %}Registrar Cuenta – CursosDjango{% endblock %}

{% block content %}
<div class="container py-5" style="max-width:400px;">
  <h2>Registro</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-success">Crear cuenta</button>
  </form>
  <p class="mt-3">
    ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia Sesión</a>
  </p>
</div>
{% endblock %}
